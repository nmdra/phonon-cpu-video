name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python -m pip install uv==0.8.13
          uv lock --check
          uv sync --frozen
      - name: Tests, lint, and dependency audit
        run: |
          uv run --frozen pytest
          uv run --frozen ruff check app tests scripts/release-inference.py
          uv run --frozen ruff format --check app tests scripts/release-inference.py
          uv run --frozen pip-audit --disable-pip --no-deps -r requirements.lock
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build native smoke image (never push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: phonon-video:ci
          cache-from: type=gha,scope=video-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=video-${{ matrix.arch }}
      - name: No-model smoke checks
        run: scripts/smoke-test.sh phonon-video:ci
