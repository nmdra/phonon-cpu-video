[project]
name = "phonon-cpu-video"
version = "0.2.0"
description = "Bounded video ingress and CLI adapter for the Phonon CPU container"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<1",
  "python-multipart>=0.0.22,<1",
  "starlette>=0.49.1,<2",
  "uvicorn>=0.38.0,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
